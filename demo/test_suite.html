<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor 测试套件</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; min-height: 100vh; padding: 20px; }
        .test-container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #1f2937; margin-bottom: 30px; }
        .test-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
        .summary-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .summary-card .number { font-size: 36px; font-weight: bold; }
        .summary-card .label { color: #6b7280; font-size: 14px; margin-top: 4px; }
        .summary-card.passed .number { color: #059669; }
        .summary-card.failed .number { color: #dc2626; }
        .summary-card.total .number { color: #3b82f6; }
        .summary-card.time .number { color: #8b5cf6; }
        .test-section { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .test-section h2 { color: #1f2937; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #e5e7eb; }
        .test-item { padding: 12px 16px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .test-item.pass { background: #d1fae5; }
        .test-item.fail { background: #fee2e2; }
        .test-item .name { color: #374151; font-weight: 500; }
        .test-item .result { font-weight: bold; }
        .test-item.pass .result { color: #059669; }
        .test-item.fail .result { color: #dc2626; }
        .test-item .duration { color: #6b7280; font-size: 12px; }
        .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-bar .fill { height: 100%; transition: width 0.3s; }
        .progress-bar .fill.pass { background: linear-gradient(90deg, #059669, #10b981); }
        .progress-bar .fill.fail { background: linear-gradient(90deg, #dc2626, #ef4444); }
        .console-output { background: #1f2937; color: #e5e7eb; padding: 16px; border-radius: 8px; margin-top: 16px; font-family: 'Fira Code', monospace; font-size: 13px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
        .console-output .error { color: #f87171; }
        .console-output .success { color: #4ade80; }
        .console-output .info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Markdown Editor 测试套件</h1>

        <div class="test-summary">
            <div class="summary-card total">
                <div class="number" id="total-count">0</div>
                <div class="label">总测试数</div>
            </div>
            <div class="summary-card passed">
                <div class="number" id="passed-count">0</div>
                <div class="label">通过</div>
            </div>
            <div class="summary-card failed">
                <div class="number" id="failed-count">0</div>
                <div class="label">失败</div>
            </div>
            <div class="summary-card time">
                <div class="number" id="time-count">0ms</div>
                <div class="label">耗时</div>
            </div>
        </div>

        <div class="test-section" id="markdown-parser-tests">
            <h2>Markdown 解析器测试</h2>
            <div id="markdown-tests"></div>
        </div>

        <div class="test-section" id="code-highlight-tests">
            <h2>代码高亮测试</h2>
            <div id="highlight-tests"></div>
        </div>

        <div class="test-section" id="search-tests">
            <h2>搜索功能测试</h2>
            <div id="search-tests"></div>
        </div>

        <div class="test-section" id="ui-tests">
            <h2>UI 功能测试</h2>
            <div id="ui-tests-container"></div>
        </div>

        <div class="test-section">
            <h2>测试日志</h2>
            <div class="console-output" id="console-output"></div>
        </div>
    </div>

    <script src="markdown_preview_standalone（1）.html" onerror="console.error('Failed to load main script')"></script>
    <script>
    (function() {
        const results = { total: 0, passed: 0, failed: 0, startTime: 0 };
        const logContainer = document.getElementById('console-output');

        function log(message, type = 'info') {
            const span = document.createElement('span');
            span.className = type;
            span.textContent = `[${new Date().toLocaleTimeString()}] ${message}\n`;
            logContainer.appendChild(span);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function assert(condition, message) {
            if (!condition) {
                throw new Error(message || 'Assertion failed');
            }
        }

        function runTest(name, testFn, container) {
            const startTime = performance.now();
            const item = document.createElement('div');
            item.className = 'test-item';
            container.appendChild(item);

            try {
                testFn();
                const duration = Math.round(performance.now() - startTime);
                item.className += ' pass';
                item.innerHTML = `<span class="name">${name}</span><span class="result">通过</span><span class="duration">${duration}ms</span>`;
                results.passed++;
                log(`✓ ${name}`, 'success');
                return true;
            } catch (e) {
                const duration = Math.round(performance.now() - startTime);
                item.className += ' fail';
                item.innerHTML = `<span class="name">${name}</span><span class="result">失败: ${e.message}</span><span class="duration">${duration}ms</span>`;
                results.failed++;
                log(`✗ ${name}: ${e.message}`, 'error');
                return false;
            } finally {
                results.total++;
            }
        }

        function updateSummary() {
            document.getElementById('total-count').textContent = results.total;
            document.getElementById('passed-count').textContent = results.passed;
            document.getElementById('failed-count').textContent = results.failed;
            document.getElementById('time-count').textContent = Math.round(performance.now() - results.startTime) + 'ms';
        }

        function testMarkdownParser() {
            const container = document.getElementById('markdown-tests');

            runTest('标题解析 - H1', () => {
                const result = MarkdownParser.parse('# Hello World');
                assert(result.includes('<h1>'), 'Should contain h1 tag');
            }, container);

            runTest('标题解析 - H2', () => {
                const result = MarkdownParser.parse('## Hello World');
                assert(result.includes('<h2>'), 'Should contain h2 tag');
            }, container);

            runTest('粗体文本解析', () => {
                const result = MarkdownParser.parse('**bold text**');
                assert(result.includes('<strong>bold text</strong>'), 'Should contain strong tag');
            }, container);

            runTest('斜体文本解析', () => {
                const result = MarkdownParser.parse('*italic text*');
                assert(result.includes('<em>italic text</em>'), 'Should contain em tag');
            }, container);

            runTest('链接解析', () => {
                const result = MarkdownParser.parse('[Link Text](https://example.com)');
                assert(result.includes('<a href="https://example.com"'), 'Should contain anchor tag');
                assert(result.includes('>Link Text<'), 'Should contain link text');
            }, container);

            runTest('图片解析', () => {
                const result = MarkdownParser.parse('![Alt Text](image.png)');
                assert(result.includes('<img src="image.png"'), 'Should contain img tag');
                assert(result.includes('alt="Alt Text"'), 'Should contain alt text');
            }, container);

            runTest('代码块解析', () => {
                const result = MarkdownParser.parse('```python\nprint("hello")\n```');
                assert(result.includes('<pre><code>'), 'Should contain pre code tags');
            }, container);

            runTest('引用块解析', () => {
                const result = MarkdownParser.parse('> This is a quote');
                assert(result.includes('<blockquote>'), 'Should contain blockquote tag');
            }, container);

            runTest('无序列表解析', () => {
                const result = MarkdownParser.parse('- Item 1\n- Item 2');
                assert(result.includes('<ul>'), 'Should contain ul tag');
                assert(result.includes('<li>'), 'Should contain li tags');
            }, container);

            runTest('有序列表解析', () => {
                const result = MarkdownParser.parse('1. First\n2. Second');
                assert(result.includes('<ol>'), 'Should contain ol tag');
                assert(result.includes('<li>'), 'Should contain li tags');
            }, container);

            runTest('表格解析', () => {
                const result = MarkdownParser.parse('| Header | Header |\n| --- | --- |\n| Cell | Cell |');
                assert(result.includes('<table>'), 'Should contain table tag');
                assert(result.includes('<th>'), 'Should contain th tags');
                assert(result.includes('<td>'), 'Should contain td tags');
            }, container);

            runTest('水平线解析', () => {
                const result = MarkdownParser.parse('---');
                assert(result.includes('<hr'), 'Should contain hr tag');
            }, container);

            runTest('HTML转义', () => {
                const result = MarkdownParser.parse('<script>alert("xss")</script>');
                assert(!result.includes('<script>'), 'Should escape script tags');
                assert(result.includes('&lt;'), 'Should contain escaped characters');
            }, container);

            runTest('多行段落解析', () => {
                const result = MarkdownParser.parse('Line 1\nLine 2\nLine 3');
                assert(result.includes('<p>'), 'Should contain paragraph tags');
            }, container);
        }

        function testCodeHighlighter() {
            const container = document.getElementById('highlight-tests');

            runTest('Python 关键字高亮', () => {
                const result = CodeBlockParser.highlightSyntax('def hello():', 'python');
                assert(result.includes('code-keyword'), 'Should highlight def keyword');
            }, container);

            runTest('JavaScript 关键字高亮', () => {
                const result = CodeBlockParser.highlightSyntax('function test()', 'javascript');
                assert(result.includes('code-keyword'), 'Should highlight function keyword');
            }, container);

            runTest('字符串高亮', () => {
                const result = CodeBlockParser.highlightSyntax('"hello world"', 'python');
                assert(result.includes('code-string'), 'Should highlight strings');
            }, container);

            runTest('数字高亮', () => {
                const result = CodeBlockParser.highlightSyntax('123 3.14', 'python');
                assert(result.includes('code-number'), 'Should highlight numbers');
            }, container);

            runTest('注释高亮 - Python', () => {
                const result = CodeBlockParser.highlightSyntax('# comment', 'python');
                assert(result.includes('code-comment'), 'Should highlight Python comments');
            }, container);

            runTest('注释高亮 - JavaScript', () => {
                const result = CodeBlockParser.highlightSyntax('// comment', 'javascript');
                assert(result.includes('code-comment'), 'Should highlight JS comments');
            }, container);

            runTest('类名高亮', () => {
                const result = CodeBlockParser.highlightSyntax('MyClass', 'python');
                assert(result.includes('code-class'), 'Should highlight class names');
            }, container);

            runTest('多行代码块处理', () => {
                const code = 'def foo():\n    print("hello")\n    return 42';
                const result = CodeBlockParser.highlightSyntax(code, 'python');
                const lines = result.split('\n').length;
                assert(lines === 3, `Should have 3 lines, got ${lines}`);
            }, container);

            runTest('HTML 标签高亮', () => {
                const result = CodeBlockParser.highlightSyntax('<div>content</div>', 'html');
                assert(result.includes('&lt;'), 'Should escape HTML');
            }, container);

            runTest('CSS 属性高亮', () => {
                const result = CodeBlockParser.highlightSyntax('color: red;', 'css');
                assert(result.includes('code-keyword'), 'Should highlight CSS properties');
            }, container);

            runTest('多语言支持 - Java', () => {
                const result = CodeBlockParser.highlightSyntax('public class Test', 'java');
                assert(result.includes('code-keyword'), 'Should highlight Java keywords');
            }, container);

            runTest('多语言支持 - Go', () => {
                const result = CodeBlockParser.highlightSyntax('package main', 'go');
                assert(result.includes('code-keyword'), 'Should highlight Go keywords');
            }, container);

            runTest('多语言支持 - Rust', () => {
                const result = CodeBlockParser.highlightSyntax('fn main()', 'rust');
                assert(result.includes('code-keyword'), 'Should highlight Rust keywords');
            }, container);
        }

        function testSearchFunctionality() {
            const container = document.getElementById('search-tests');

            runTest('搜索初始化', () => {
                assert(typeof SearchManager !== 'undefined', 'SearchManager should be defined');
            }, container);

            runTest('搜索管理器存在', () => {
                const editor = document.getElementById('editor');
                assert(editor !== null, 'Editor element should exist');
            }, container);

            runTest('搜索面板显示/隐藏', () => {
                const searchPanel = document.getElementById('search-panel');
                searchPanel.classList.add('show');
                assert(searchPanel.classList.contains('show'), 'Should show search panel');
                searchPanel.classList.remove('show');
            }, container);
        }

        function testUIFunctionality() {
            const container = document.getElementById('ui-tests-container');

            runTest('编辑器元素存在', () => {
                const editor = document.getElementById('editor');
                assert(editor !== null, 'Editor should exist');
            }, container);

            runTest('预览区域存在', () => {
                const preview = document.getElementById('preview');
                assert(preview !== null, 'Preview should exist');
            }, container);

            runTest('字数统计元素存在', () => {
                const stats = document.getElementById('code-stats');
                assert(stats !== null, 'Stats element should exist');
            }, container);

            runTest('字数统计功能', () => {
                const editor = document.getElementById('editor');
                editor.value = 'Hello world test content';
                editor.dispatchEvent(new Event('input'));
                const stats = document.getElementById('code-stats');
                assert(stats.textContent.includes('字数'), 'Should show character count');
                assert(stats.textContent.includes('词数'), 'Should show word count');
            }, container);

            runTest('字数统计 - 空内容', () => {
                const editor = document.getElementById('editor');
                editor.value = '';
                editor.dispatchEvent(new Event('input'));
                const stats = document.getElementById('code-stats');
                assert(stats.textContent.includes('字数: 0'), 'Should show 0 for empty content');
            }, container);

            runTest('字数统计 - 多行内容', () => {
                const editor = document.getElementById('editor');
                editor.value = 'Line 1\nLine 2\nLine 3';
                editor.dispatchEvent(new Event('input'));
                const stats = document.getElementById('code-stats');
                assert(stats.textContent.includes('行数: 3'), 'Should show 3 lines');
            }, container);

            runTest('保存按钮存在', () => {
                const saveBtn = document.getElementById('save-btn');
                assert(saveBtn !== null, 'Save button should exist');
            }, container);

            runTest('上传按钮存在', () => {
                const uploadBtn = document.getElementById('file-input');
                assert(uploadBtn !== null, 'File input should exist');
            }, container);

            runTest('图片上传按钮存在', () => {
                const imageInput = document.getElementById('image-input');
                assert(imageInput !== null, 'Image input should exist');
            }, container);

            runTest('GFM 切换存在', () => {
                const gfmToggle = document.getElementById('gfm-toggle');
                assert(gfmToggle !== null, 'GFM toggle should exist');
            }, container);

            runTest('自动保存设置按钮存在', () => {
                const autoSaveBtn = document.getElementById('auto-save-settings-btn');
                assert(autoSaveBtn !== null, 'Auto-save settings button should exist');
            }, container);

            runTest('Toast 元素存在', () => {
                const errorToast = document.getElementById('error-toast');
                const successToast = document.getElementById('success-toast');
                assert(errorToast !== null && successToast !== null, 'Toast elements should exist');
            }, container);

            runTest('主题样式加载', () => {
                const toolbar = document.querySelector('.toolbar');
                const style = window.getComputedStyle(toolbar);
                assert(style.backgroundColor !== '', 'Toolbar should have styles');
            }, container);

            runTest('响应式布局媒体查询', () => {
                const styleSheets = document.styleSheets;
                let hasMediaQuery = false;
                for (let sheet of styleSheets) {
                    try {
                        for (let rule of sheet.cssRules) {
                            if (rule.type === CSSRule.MEDIA_RULE) {
                                hasMediaQuery = true;
                                break;
                            }
                        }
                    } catch (e) {}
                    if (hasMediaQuery) break;
                }
                assert(hasMediaQuery, 'Should have media queries for responsive design');
            }, container);
        }

        function runAllTests() {
            results.startTime = performance.now();
            log('开始测试...', 'info');

            try {
                testMarkdownParser();
                log(`Markdown 解析器测试完成: ${results.total} 项测试\n`, 'info');
                updateSummary();

                testCodeHighlighter();
                log(`代码高亮测试完成: ${results.total} 项测试\n`, 'info');
                updateSummary();

                testSearchFunctionality();
                log(`搜索功能测试完成: ${results.total} 项测试\n`, 'info');
                updateSummary();

                testUIFunctionality();
                log(`UI 功能测试完成: ${results.total} 项测试\n`, 'info');
                updateSummary();

            } catch (e) {
                log(`测试执行出错: ${e.message}`, 'error');
            }

            updateSummary();
            log(`\n测试完成! 总计: ${results.total}, 通过: ${results.passed}, 失败: ${results.failed}`, 'success');
            log(`总耗时: ${Math.round(performance.now() - results.startTime)}ms`, 'info');
        }

        if (typeof MarkdownParser !== 'undefined' && typeof CodeBlockParser !== 'undefined') {
            runAllTests();
        } else {
            log('错误: 无法加载 MarkdownParser 或 CodeBlockParser', 'error');
            document.getElementById('total-count').textContent = '加载失败';
        }
    })();
    </script>
</body>
</html>
